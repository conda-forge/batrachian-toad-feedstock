schema_version: 1

context:
  version: "0.6.18"
  python_min: "3.14"

package:
  name: batrachian-toad
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/b/batrachian-toad/batrachian_toad-${{ version }}.tar.gz
    sha256: 03436c5a8db56cf6569a559cc29749f89476fea9629df14edc7effe69dc39c91

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
  python:
    entry_points:
      - toad = toad.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling =1.28.0
    - pip
  run:
    - python >=${{ python_min }}
    - textual =8.2.6
    - tree_sitter >=0.25.0
    - tree_sitter_languages
    - click =8.3.3
    - httpx =0.28.1
    - platformdirs =4.9.6
    - rich =15.0.0
    - typeguard =4.5.1
    - xdg-base-dirs >=6.0.2
    - textual-serve >=1.1.2
    - textual-speedups =0.2.1
    - packaging =26.2
    - bashlex =0.18
    - pathspec =1.1.1
    - notify-py =0.3.43
    - pyperclip =1.11.0
    - watchdog =6.0.0
    - setproctitle =1.3.7
    - psutil =7.2.2
    - aiosqlite =0.22.1
    - textual-diff-view =0.1.5
    - xclip

tests:
  - python:
      imports:
        - toad
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - toad --help

about:
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/batrachianai/toad
  summary: A unified interface for AI in your terminal.

extra:
  recipe-maintainers:
    - davidbrochart
